server:
  # 云托管平台（Render / 阿里云函数计算等）会注入 PORT 环境变量
  port: ${PORT:8080}
  servlet:
    encoding:
      charset: UTF-8
      force: true

spring:
  application:
    name: campus-activity
  profiles:
    active: mysql
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 换机器时只需改这几个环境变量，或直接改下面的默认值
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:campus_activity}?characterEncoding=utf8&useSSL=${DB_SSL:false}&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&connectTimeout=15000&socketTimeout=30000&rewriteBatchedStatements=true
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:root}
    hikari:
      # SQLPub 免费版 30 个并发连接上限，这里压到 10 留余量
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 15000
      idle-timeout: 300000
      max-lifetime: 1200000
      connection-test-query: SELECT 1
  sql:
    init:
      mode: never
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss
    serialization:
      write-dates-as-timestamps: false
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    banner: false
    db-config:
      id-type: auto

# 上传文件落地目录（相对工作目录，避免绝对路径）
file:
  upload-path: ./upload

app:
  jwt:
    # 生产环境请通过环境变量 APP_JWT_SECRET 覆盖
    secret: ${APP_JWT_SECRET:campus-activity-system-jwt-secret-2026-please-change}
    expire-hours: 2
  registration:
    # 论文对照实验开关：true 时退化为"先查后改"，会超卖。生产必须 false
    naive: false
  checkin:
    # 签到码有效期（分钟）
    code-minutes: 30
    # 活动开始前多少分钟开放签到
    early-minutes: 30

logging:
  level:
    root: info
    com.campus.activity: debug
